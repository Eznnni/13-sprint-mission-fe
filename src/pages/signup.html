<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles/reset.css" />
    <link rel="stylesheet" href="/src/styles/root.css" />
    <link rel="stylesheet" href="/src/styles/pages/login-signup.css" />
    <title>회원가입</title>
    <link rel="icon" href="/src/assets/icons/favicon.ico" />
  </head>
  <body>
    <div class="contents-wrapper">
      <header>
        <a href="/" class="logo-container">
          <img
            id="logo"
            src="/src/assets/img/big-logo.png"
            alt="판다마켓 판다로고"
          />
        </a>
      </header>

      <div class="container">
        <div class="login-box">
          <form id="signup" action="" method="">
            <div class="content-box">
              <label class="content-title" for="user-email">이메일</label>
              <input
                class="content-input"
                type="email"
                id="user-email"
                name="userEmail"
                placeholder="이메일을 입력해주세요"
                required
              />
            </div>

            <div class="content-box">
              <label class="content-title" for="user-name">닉네임</label>
              <input
                class="content-input"
                type="text"
                id="user-name"
                name="userName"
                placeholder="닉네임을 입력해주세요"
                required
              />
            </div>

            <div class="content-box">
              <label class="content-title" for="user-pw">비밀번호</label>
              <div class="pw-input-wrapper">
                <input
                  class="content-input"
                  type="password"
                  id="user-pw"
                  name="userPassword"
                  placeholder="비밀번호를 입력해주세요"
                  required
                />
                <button class="pw-toggle" type="button">
                  <img
                    src="/src/assets/icons/btn_visibility_off_24px.svg"
                    alt="비밀번호 보기"
                  />
                </button>
              </div>
            </div>

            <div class="content-box">
              <label class="content-title" for="user-pw-confirm"
                >비밀번호 확인</label
              >
              <div class="pw-input-wrapper">
                <input
                  class="content-input"
                  type="password"
                  id="user-pw-confirm"
                  name="userPasswordConfirm"
                  placeholder="비밀번호를 다시 한 번 입력해주세요"
                  required
                />
                <button class="pw-toggle" type="button">
                  <img
                    src="/src/assets/icons/btn_visibility_off_24px.svg"
                    alt="비밀번호 보기"
                  />
                </button>
              </div>
            </div>

            <button class="submit-bttn" type="submit">회원가입</button>
          </form>
        </div>

        <div class="social-login-wrapper">
          <div class="social-login">
            <div>간편 로그인하기</div>
            <div class="icon-container">
              <a
                href="https://www.google.com/"
                target="_blank"
                rel="noopener noreferrer"
                ><img src="/src/assets/icons/login_google.png" alt="google"
              /></a>
              <a
                href="https://www.kakaocorp.com/page/"
                target="_blank"
                rel="noopener noreferrer"
                ><img src="/src/assets/icons/login_kakao.png" alt="kakao"
              /></a>
            </div>
          </div>
        </div>

        <div class="signup-wrapper">
          <span>이미 회원이신가요?</span>
          <a href="/src/pages/login.html">로그인</a>
        </div>
      </div>
    </div>
  </body>
</html>
